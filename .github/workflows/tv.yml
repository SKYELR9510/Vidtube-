name: Vidtube TV (Samsung)

on:
  push:
    branches: [main]
    paths: ["tv/**", "pc/src/**", "pc/build-tv.mjs", ".github/workflows/tv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Versión
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
      - name: Compilar
        working-directory: pc
        run: |
          npm install --no-audit --no-fund
          TV_VERSION=$VERSION node build-tv.mjs
      - name: Empaquetar .wgt
        working-directory: tv/dist
        run: zip -qr ../Vidtube-TV-$VERSION.wgt .
      - name: Capturas de prueba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          SHOTS=$PWD/tv/shots timeout 150 xvfb-run -a -s "-screen 0 1920x1080x24" pc/node_modules/.bin/electron tv/shot.cjs --no-sandbox || true
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-${{ env.VERSION }}
          name: Vidtube TV ${{ env.VERSION }}
          make_latest: "false"
          body: |
            Vidtube para TV Samsung ${{ env.VERSION }} (2020 en adelante).
            Instálalo con Apps2Samsung en modo desarrollador: elige "Custom .wgt" y selecciona Vidtube-TV-${{ env.VERSION }}.wgt.
          files: |
            tv/Vidtube-TV-${{ env.VERSION }}.wgt
            tv/shots/*
