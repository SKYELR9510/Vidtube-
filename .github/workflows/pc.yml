name: Vidtube PC (Windows)

# Compila el instalador .exe para Windows cuando cambia la carpeta pc/
on:
  push:
    branches: [main]
    paths: ["pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Notas de la versión
        shell: bash
        working-directory: .
        run: |
          node .github/scripts/notas.mjs pc "pc-1.*" pc/notas.md pc
          { cat pc/notas.md; echo; echo "---"; echo "Descarga **Vidtube-Setup-1.0.${{ github.run_number }}.exe** e instálalo (o usa el botón Actualizar de la app)."; echo 'Si Windows muestra "Windows protegió tu PC": Más información → Ejecutar de todas formas.'; } > pc/body.md
      - name: Versión
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          npm pkg set version=$VERSION
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Revisión de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Versiones usadas
        shell: bash
        run: npm ls youtubei.js bgutils-js shaka-player electron || true
      - name: Compilar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-${{ env.VERSION }}
          name: Vidtube PC ${{ env.VERSION }}
          make_latest: "false"
          body_path: pc/body.md
          files: pc/release/Vidtube-Setup-${{ env.VERSION }}.exe

  screenshots:
    # Abre la app en Linux y toma capturas de las pantallas para revisarlas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - run: VIDTUBE_SHOTS=$PWD/shots timeout 420 xvfb-run -a -s "-screen 0 1440x900x24" npx electron . --no-sandbox || true
      - name: Subir capturas (release de pruebas, no es una versión)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-capturas
          name: Capturas de prueba (PC)
          prerelease: true
          make_latest: "false"
          files: pc/shots/*
