name: Vidtube Android (rama de diseño)

# Compila y prueba las ramas de trabajo (no publica versiones ni afecta a las actualizaciones de la app).
# La APK queda como artefacto descargable del workflow.
on:
  push:
    branches-ignore: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", "gradle.properties", ".github/workflows/android-rama.yml", ".github/scripts/android-shots.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Clave de firma y versión
        id: v
        env:
          KEYSTORE_BASE64: ${{ secrets.VIDTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vidtube.jks"
            echo "VIDTUBE_KEYSTORE=$RUNNER_TEMP/vidtube.jks" >> "$GITHUB_ENV"
          fi
          N=$(git rev-list --count HEAD)
          echo "VIDTUBE_BUILD=$N" >> "$GITHUB_ENV"
          echo "code=$((100 + N))" >> "$GITHUB_OUTPUT"
      - name: Pruebas automáticas y APK
        env:
          VIDTUBE_STORE_PASSWORD: ${{ secrets.VIDTUBE_STORE_PASSWORD }}
          VIDTUBE_TMDB_TOKEN: ${{ secrets.VIDTUBE_TMDB_TOKEN }}
          VIDTUBE_PANEL_URL: ${{ secrets.VIDTUBE_PANEL_URL }}
          VIDTUBE_PANEL_KEY: ${{ secrets.VIDTUBE_PANEL_KEY }}
          VIDTUBE_KEY_ALIAS: ${{ secrets.VIDTUBE_KEY_ALIAS || 'vidtube' }}
          VIDTUBE_KEY_PASSWORD: ${{ secrets.VIDTUBE_KEY_PASSWORD || secrets.VIDTUBE_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          CODE=$((100 + VIDTUBE_BUILD))
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Vidtube-$CODE-prueba.apk"
      - name: Revisión de Android (lint)
        continue-on-error: true
        run: ./gradlew lintRelease
      - name: Resultados de pruebas y lint
        if: always()
        run: |
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"; done
          grep -E "Error:|errors," app/build/reports/lint-results.txt || true
      - name: Firma de la APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs out/*.apk | tee out/firma.txt
      - name: APK de prueba descargable (versión previa, no se ofrece como actualización)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_REF_NAME//\//-}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Vidtube Android · rama $GITHUB_REF_NAME (prueba)" --notes "APK de prueba de la rama $GITHUB_REF_NAME. No es la versión oficial; firmada con la clave oficial de Vidtube."
          gh release upload "$TAG" out/*.apk out/firma.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Vidtube-${{ steps.v.outputs.code }}-prueba-apk
          path: |
            out/*.apk
            out/firma.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-pruebas-y-lint
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.html

  capturas:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Vidtube-${{ needs.build.outputs.code }}-prueba-apk
          path: apk
      - run: cp apk/*.apk app.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -memory 4096 -cores 4 -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-emulador
          path: shots/
      - name: Capturas en una versión previa (para verlas sin descargar el artefacto)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_REF_NAME//\//-}"
          find shots -size 0 -delete
          gh release upload "$TAG" shots/*.png --clobber || true
