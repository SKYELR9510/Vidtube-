name: Compilar y publicar Vidtube

# Se ejecuta al subir cambios, a mano desde la pestaña Actions,
# o desde el flujo que actualiza el extractor.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Siempre la última versión de main (incluye el commit del extractor si acaba de cambiar)
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.VIDTUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto VIDTUBE_KEYSTORE_BASE64. Revisa la guía GITHUB.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vidtube.jks"
          echo "VIDTUBE_KEYSTORE=$RUNNER_TEMP/vidtube.jks" >> "$GITHUB_ENV"
          # Número de versión = cantidad de cambios en el repositorio (siempre sube)
          echo "VIDTUBE_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          VIDTUBE_STORE_PASSWORD: ${{ secrets.VIDTUBE_STORE_PASSWORD }}
          # El alias y la contraseña de la clave son opcionales: si no existen se usan
          # "vidtube" y la misma contraseña del almacén.
          VIDTUBE_KEY_ALIAS: ${{ secrets.VIDTUBE_KEY_ALIAS || 'vidtube' }}
          VIDTUBE_KEY_PASSWORD: ${{ secrets.VIDTUBE_KEY_PASSWORD || secrets.VIDTUBE_STORE_PASSWORD }}
        run: |
          if [ -z "$VIDTUBE_STORE_PASSWORD" ]; then
            echo "::error::Falta el secreto VIDTUBE_STORE_PASSWORD. Revisa la guía GITHUB.md"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          CODE=$((100 + VIDTUBE_BUILD))
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Vidtube-$CODE.apk"
          echo "VIDTUBE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "MSG=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VIDTUBE_CODE }}
          name: Vidtube 1.3.${{ env.VIDTUBE_BUILD }}
          body: |
            ${{ env.MSG }}

            Instala **Vidtube-${{ env.VIDTUBE_CODE }}.apk** o actualiza desde la misma app.
          files: out/Vidtube-${{ env.VIDTUBE_CODE }}.apk
          make_latest: true
